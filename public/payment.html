<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Pagar receta premium</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Stripe -->
  <script src="https://js.stripe.com/v3/"></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #fffaf0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      width: 90%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      text-align: center;
    }

    h2 {
      color: #9b87ff;
      margin-bottom: 8px;
    }

    p {
      color: #555;
      font-size: 14px;
      margin-bottom: 20px;
    }

    #payment-element {
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      background: #9b87ff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.2s ease;
    }

    button:hover {
      background: #7b5cff;
      transform: scale(1.02);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #error-message {
      margin-top: 12px;
      color: #e63946;
      font-size: 14px;
      min-height: 18px;
    }

    .emoji {
      font-size: 36px;
      margin-bottom: 8px;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="emoji">🍰</div>
    <h2>Receta premium</h2>
    <p>Desbloquea contenido especial del juego</p>

    <form id="payment-form">
      <div id="payment-element"></div>
      <button id="submit">Pagar</button>
      <div id="error-message"></div>
    </form>
  </div>

  <!-- Tu lógica de pago -->
  <script type="module" src="payment.js"></script>
</body>
</html>
